name: CI

# Build, typecheck and test the workspace on every pull request and every push to main or
# develop, and the desktop app (packages/native) on Windows, macOS and Linux.
#
# Order matters and is not the usual one: `packages/extension` resolves `vtype-core` through the
# workspace package's published entry (`dist/index.js` / `dist/index.d.ts`), not through a path
# alias. On a fresh clone that directory does not exist yet, so the build has to run before the
# typecheck and before the tests. `pnpm -r` walks the workspace in dependency order, so one
# `pnpm -r build` builds core first and then the extension.
#
# The extension's build (packages/extension/build.mjs) is itself a check: it fails if an output
# still contains module syntax (a classic content script / service worker cannot run it) or if
# the manifest or an HTML page points at a file the build did not produce.

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field (pnpm@11.1.1).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # package.json engines allows Node >= 20; this pins the version the extension is
      # developed and hand-verified on, so a green run means that exact combination is green.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # The unpacked extension exactly as the build produced it, so a store package can be
      # traced back to the commit it came from without rebuilding.
      - name: Upload the built extension
        uses: actions/upload-artifact@v4
        with:
          name: vtype-extension-dist-${{ github.sha }}
          path: packages/extension/dist
          if-no-files-found: error
          retention-days: 14

  # The desktop app (packages/native) on the three systems it ships for. The development machine
  # is Windows only, so for macOS and Linux this job is the whole guarantee: it has to build,
  # lint clean and pass its tests there. build.rs reads the extension's _locales, which the
  # checkout already has; no Node step is needed.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: packages/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native

      # tray-icon (GTK / AppIndicator), the X11 and keyboard libraries the Linux build links to.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
