name: native release

# Builds the desktop app (packages/native) for Windows, macOS and Linux and gathers what each
# channel ships: a zip, a universal tar.gz, a .deb, an unsigned MSIX (the Store signs it), the
# third-party licence notices, SHA256SUMS.txt and a Homebrew formula with the checksum filled in.
#
# A `native-v*` tag attaches all of it to a *draft* GitHub Release; publishing that draft, the
# Store submission, npm and the Homebrew tap stay manual steps (see packages/native/README.md).
# The five npm packages are packed here too, after the release job and from the same zip and
# tar.gz, and kept as the run's `npm-packages` artifact (not attached to the release): packed on
# Windows, the macOS and Linux binaries would lose their executable bit (packages/native/npm).
# Running it by hand (workflow_dispatch) is a dry run: the files end up as workflow artifacts and
# no release is made. GitHub only offers the manual run once this file is on the default branch,
# so a push to develop that touches the release files is a dry run as well (path filters do not
# apply to tag pushes, so the tag trigger is unaffected).

on:
  push:
    tags:
      - 'native-v*'
    branches:
      - develop
    paths:
      - '.github/workflows/native-release.yml'
      - 'scripts/release/**'
      - 'packages/native/packaging/**'
      - 'packages/native/npm/**'
      - 'packages/native/about.*'
      - 'packages/native/Cargo.toml'
      - 'packages/native/RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The number comes from packages/native/Cargo.toml; a tag has to say the same.
      - name: Read and check the version
        id: read
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' packages/native/Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "native-v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packages/native/Cargo.toml ($version)"
            exit 1
          fi

  windows:
    name: windows
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs embeds the speech page that the extension's build writes to
      # packages/extension/dist-desktop/ (standalone plan C3), so the workspace is built first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Build the speech page
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Build
        working-directory: packages/native
        run: cargo build --release --locked

      - name: Zip
        run: |
          mkdir -p out/zip
          cp packages/native/target/release/vtype.exe LICENSE out/zip/
          (cd out/zip && 7z a "../vtype-${VERSION}-windows-x64.zip" vtype.exe LICENSE)

      # Unsigned: the Store re-signs packages it accepts. The script's defaults are vtype's
      # Partner Center identity, so this package is the one to upload to the Store.
      - name: MSIX
        shell: pwsh
        run: ./scripts/release/build-msix.ps1 -OutDir out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: |
            out/*.zip
            out/*.msix
          if-no-files-found: error

  macos:
    name: macos
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs embeds the speech page that the extension's build writes to
      # packages/extension/dist-desktop/ (standalone plan C3), so the workspace is built first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Build the speech page
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      # Both architectures, joined into one universal binary.
      - name: Build
        working-directory: packages/native
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          lipo -create -output vtype \
            target/x86_64-apple-darwin/release/vtype target/aarch64-apple-darwin/release/vtype
          lipo -info vtype

      - name: Archive
        run: |
          mkdir -p out/tar
          cp packages/native/vtype LICENSE out/tar/
          tar -czf "out/vtype-${VERSION}-macos-universal.tar.gz" -C out/tar vtype LICENSE

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: out/*.tar.gz
          if-no-files-found: error

  linux:
    name: linux
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs embeds the speech page that the extension's build writes to
      # packages/extension/dist-desktop/ (standalone plan C3), so the workspace is built first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Build the speech page
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev

      - name: Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-about

      - name: Build
        working-directory: packages/native
        run: cargo build --release --locked

      # The .deb carries the autostart entry, so it needs no `vtype install`. Its contents are
      # listed so the log shows them; nothing is registered with Chrome (standalone plan C4).
      - name: Debian package
        working-directory: packages/native
        run: |
          cargo deb --no-build --locked --output "../../out/vtype_${VERSION}_amd64.deb"
          dpkg-deb --contents "../../out/vtype_${VERSION}_amd64.deb" | tee ../../out/deb-contents.txt
          for f in ./usr/bin/vtype ./etc/xdg/autostart/vtype.desktop; do
            grep -q " $f\$" ../../out/deb-contents.txt || { echo "::error::$f is missing from the .deb"; exit 1; }
          done
          if grep -q native-messaging-hosts ../../out/deb-contents.txt; then
            echo "::error::the .deb still registers with Chrome"; exit 1
          fi

      # The plain binary as well, for the npm package and for other distributions.
      - name: Archive
        run: |
          mkdir -p out/tar
          cp packages/native/target/release/vtype LICENSE out/tar/
          tar -czf "out/vtype-${VERSION}-linux-x64.tar.gz" -C out/tar vtype LICENSE

      # Licences of every crate the three builds use (about.toml lists the targets).
      - name: Third-party notices
        working-directory: packages/native
        run: cargo about generate --locked about.hbs --output-file ../../out/THIRD_PARTY_NOTICES.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: |
            out/*.deb
            out/*.tar.gz
            out/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  release:
    name: release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and the Homebrew formula
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          mac_sha=$(sha256sum "vtype-${VERSION}-macos-universal.tar.gz" | cut -d' ' -f1)
          sed -e "s/@@VERSION@@/${VERSION}/g" -e "s/@@SHA256@@/${mac_sha}/g" \
            ../packages/native/packaging/homebrew/vtype.rb > vtype.rb
          ! grep -q '@@' vtype.rb

      - name: Upload (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: native-release-dry-run
          path: dist/*
          if-no-files-found: error

      # A draft: nothing is public until someone presses Publish on the release page.
      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --title "vtype desktop ${VERSION}" --notes-file packages/native/RELEASE_NOTES.md

  # After the release job on purpose: that job attaches every artifact of the run it finds, so
  # an npm-packages artifact uploaded earlier would end up in the release and in SHA256SUMS.txt.
  npm:
    name: npm packages
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NPM_DIR: packages/native/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the versions
        run: |
          for p in vtype-win32-x64 vtype-darwin-arm64 vtype-darwin-x64 vtype-linux-x64 vtype; do
            v=$(node -p "require('./${NPM_DIR}/$p/package.json').version")
            [ "$v" = "$VERSION" ] || { echo "::error::$p/package.json is $v, not $VERSION"; exit 1; }
          done
          node -e '
            const deps = require(`./${process.env.NPM_DIR}/vtype/package.json`).optionalDependencies;
            for (const [name, v] of Object.entries(deps)) {
              if (v !== process.env.VERSION) { console.log(`::error::${name} is ${v} in vtype/package.json`); process.exit(1); }
            }'

      # The same artifacts the release job summed into SHA256SUMS.txt and attached.
      - name: Download (Windows)
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: src
      - name: Download (macOS)
        uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: src
      - name: Download (Linux)
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src

      - name: Put the binaries into the packages
        run: |
          mkdir -p src/win src/mac src/linux out/npm
          unzip -q "src/vtype-${VERSION}-windows-x64.zip" vtype.exe -d src/win
          tar -xzf "src/vtype-${VERSION}-macos-universal.tar.gz" -C src/mac vtype
          tar -xzf "src/vtype-${VERSION}-linux-x64.tar.gz" -C src/linux vtype
          install -D -m 644 src/win/vtype.exe "${NPM_DIR}/vtype-win32-x64/bin/vtype.exe"
          install -D -m 755 src/mac/vtype "${NPM_DIR}/vtype-darwin-arm64/bin/vtype"
          install -D -m 755 src/mac/vtype "${NPM_DIR}/vtype-darwin-x64/bin/vtype"
          install -D -m 755 src/linux/vtype "${NPM_DIR}/vtype-linux-x64/bin/vtype"
          (cd src && sha256sum "vtype-${VERSION}-windows-x64.zip" "vtype-${VERSION}-macos-universal.tar.gz" \
            "vtype-${VERSION}-linux-x64.tar.gz") > out/npm/SOURCE-SHA256SUMS.txt
          cat out/npm/SOURCE-SHA256SUMS.txt

      - name: Pack
        run: |
          for p in vtype-win32-x64 vtype-darwin-arm64 vtype-darwin-x64 vtype-linux-x64 vtype; do
            (cd "${NPM_DIR}/$p" && npm pack --pack-destination "${GITHUB_WORKSPACE}/out/npm")
          done
          ls -l out/npm

      # Each binary in a package must be the one from the release archive, and the macOS and Linux
      # ones must stay executable (npm restores the bit only for files listed in `bin`).
      - name: Check the packages
        run: |
          check() {
            tgz="out/npm/ishizakahiroshi-$1-${VERSION}.tgz"; member="package/bin/$2"
            line=$(tar -tvzf "$tgz" "$member") || { echo "::error::$member is missing from $tgz"; exit 1; }
            echo "$1: $line"
            if [ -n "$3" ] && [ "${line%% *}" != "$3" ]; then
              echo "::error::$member in $tgz is ${line%% *}, not $3"; exit 1
            fi
            got=$(tar -xzOf "$tgz" "$member" | sha256sum | cut -d' ' -f1)
            want=$(sha256sum "$4" | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::$member in $tgz is not the binary from the release archive"; exit 1; }
            echo "$1: $member sha256 $got matches the release archive"
          }
          check vtype-darwin-arm64 vtype -rwxr-xr-x src/mac/vtype
          check vtype-darwin-x64 vtype -rwxr-xr-x src/mac/vtype
          check vtype-linux-x64 vtype -rwxr-xr-x src/linux/vtype
          check vtype-win32-x64 vtype.exe "" src/win/vtype.exe
          tar -tvzf "out/npm/ishizakahiroshi-vtype-${VERSION}.tgz" package/bin/vtype.js

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: out/npm/*
          if-no-files-found: error
