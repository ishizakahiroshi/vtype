<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vtype: settings</title>
<style>
  body { font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #0f172a; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 32px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: none; background: #4f46e5; color: #fff; cursor: pointer; }
  button:hover { background: #7c3aed; }
  fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 16px 16px; }
  legend { padding: 0 6px; font-weight: 600; }
  .choice { margin: 12px 0; }
  .choice label { font-weight: 600; cursor: pointer; }
  .choice .hint { margin: 2px 0 0 24px; font-weight: 400; color: #475569; }
  #site-form { display: flex; gap: 8px; margin: 12px 0; }
  #site-input { flex: 1 1 auto; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: inherit; }
  #site-list { list-style: none; margin: 12px 0 0; padding: 0; }
  #site-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #e2e8f0; }
  #site-list .site { flex: 1 1 auto; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  #site-list button { padding: 4px 10px; font-size: 13px; background: transparent; color: #dc2626; border: 1px solid #cbd5e1; }
  #site-list button:hover { background: #fee2e2; }
  #site-empty { color: #475569; }
  #diag-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
  #diag-actions button { background: transparent; color: inherit; border: 1px solid #cbd5e1; }
  #diag-actions button:hover { background: #f1f5f9; }
  #diag-log { margin: 12px 0 0; padding: 12px; max-height: 320px; overflow: auto; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre; }
  #diag-empty { color: #475569; }
  .lead-hint { margin: 4px 0 0; color: #475569; }
  #repl-text { box-sizing: border-box; width: 100%; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: inherit; }
  .row-actions { display: flex; align-items: center; gap: 12px; margin: 8px 0 0; }
  #repl-count { color: #475569; }
  #repl-bad { color: #dc2626; }
  #status { margin-top: 16px; font-weight: 600; min-height: 1.6em; }
  #status.ok { color: #16a34a; }
  #status.err { color: #dc2626; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e0f12; color: #e2e8f0; }
    fieldset { border-color: #334155; }
    .choice .hint { color: #94a3b8; }
    #site-input { background: #16181d; border-color: #334155; }
    #site-list li { border-top-color: #334155; }
    #site-list button { border-color: #334155; color: #f87171; }
    #site-list button:hover { background: #3f1d1d; }
    #diag-actions button { border-color: #334155; }
    #diag-actions button:hover { background: #1e293b; }
    #diag-log { background: #16181d; border-color: #334155; }
    #diag-empty { color: #94a3b8; }
    #site-empty { color: #94a3b8; }
    .lead-hint, #repl-count { color: #94a3b8; }
    #repl-text { background: #16181d; border-color: #334155; }
    #repl-bad { color: #f87171; }
  }
</style>
</head>
<body>
<h1 id="title"></h1>
<p id="lead"></p>
<fieldset>
<legend id="legend"></legend>
<div class="choice">
  <label for="click"><input type="radio" id="click" name="trigger" value="click"> <span id="click-label"></span></label>
  <p class="hint" id="click-hint"></p>
</div>
<div class="choice">
  <label for="hover"><input type="radio" id="hover" name="trigger" value="hover"> <span id="hover-label"></span></label>
  <p class="hint" id="hover-hint"></p>
</div>
</fieldset>
<fieldset>
<legend id="display-legend"></legend>
<div class="choice">
  <label for="display-all"><input type="radio" id="display-all" name="micDisplay" value="all"> <span id="display-all-label"></span></label>
  <p class="hint" id="display-all-hint"></p>
</div>
<div class="choice">
  <label for="display-hover"><input type="radio" id="display-hover" name="micDisplay" value="hover"> <span id="display-hover-label"></span></label>
  <p class="hint" id="display-hover-hint"></p>
</div>
</fieldset>
<fieldset>
<legend id="mode-legend"></legend>
<p class="lead-hint" id="mode-lead"></p>
<div class="choice">
  <label for="mode-normal"><input type="radio" id="mode-normal" name="inputMode" value="normal"> <span id="mode-normal-label"></span></label>
  <p class="hint" id="mode-normal-hint"></p>
</div>
<div class="choice">
  <label for="mode-en"><input type="radio" id="mode-en" name="inputMode" value="en"> <span id="mode-en-label"></span></label>
  <p class="hint" id="mode-en-hint"></p>
</div>
<div class="choice">
  <label for="mode-kana"><input type="radio" id="mode-kana" name="inputMode" value="kana"> <span id="mode-kana-label"></span></label>
  <p class="hint" id="mode-kana-hint"></p>
</div>
</fieldset>
<h2 id="repl-title"></h2>
<p id="repl-lead"></p>
<textarea id="repl-text" rows="6" spellcheck="false" autocomplete="off"></textarea>
<div class="row-actions"><button id="repl-save" type="button"></button> <span id="repl-count"></span></div>
<p id="repl-bad" hidden></p>
<h2 id="desktop" class="desktop-title"><span id="desktop-title"></span></h2>
<p><span id="desktop-lead"></span> <a id="desktop-install-link" target="_blank" rel="noopener"></a></p>
<h2 id="sites-title"></h2>
<p id="sites-lead"></p>
<form id="site-form">
  <input id="site-input" type="text" autocomplete="off" spellcheck="false">
  <button id="site-add" type="submit"></button>
</form>
<p id="site-empty"></p>
<ul id="site-list"></ul>

<h2 id="diag-title"></h2>
<p id="diag-lead"></p>
<div class="choice">
  <label for="diag"><input type="checkbox" id="diag"> <span id="diag-label"></span></label>
  <p class="hint" id="diag-hint"></p>
</div>
<div id="diag-actions">
  <button id="diag-copy" type="button"></button>
  <button id="diag-clear" type="button"></button>
</div>
<p class="lead-hint" id="diag-report-note"></p>
<p id="diag-empty"></p>
<pre id="diag-log" hidden></pre>

<h2 id="report-title"></h2>
<p id="report-lead"></p>
<p><button id="report-open" type="button"></button></p>

<h2 id="positions-title"></h2>
<p id="positions-lead"></p>
<p><button id="reset" type="button"></button></p>
<p id="status" role="status"></p>
<script src="options.js"></script>
</body>
</html>
