[package]
name = "vtype"
version = "0.1.0"
edition = "2021"
description = "vtype desktop: voice input into any app, using Google Chrome's speech recognition"
license = "MIT"
repository = "https://github.com/ishizakahiroshi/vtype"
authors = ["ishizakahiroshi <ishizakahiroshi.dev@gmail.com>"]
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
interprocess = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tiny-skia = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The speech page's WebSocket (standalone plan C3). Synchronous, no TLS: it serves 127.0.0.1 only.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# The speech page's per-start token from the OS's secure random source (already in the tree
# through tungstenite's rand).
getrandom = "0.4.3"
# The desktop UI every system shares (tray, shortcut, clipboard, notifications, opening URLs).
arboard = "3.6.1"
global-hotkey = "0.8.0"
notify-rust = "4.18.0"
open = "5.4.4"
tray-icon = "0.25.1"

[build-dependencies]
serde_json = "1.0.151"

# cargo-deb (child plan C9-C3): the binary and the autostart entry (so no `vtype install` is
# needed). The release workflow builds it with `cargo deb --no-build` after `cargo build --release`.
[package.metadata.deb]
maintainer = "ishizakahiroshi <ishizakahiroshi.dev@gmail.com>"
copyright = "2026, ishizakahiroshi"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Voice input into any app. vtype starts Google Chrome in a profile of its own and uses its \
speech recognition, then types the text into the app in front."""
section = "utils"
priority = "optional"
depends = "$auto, libayatana-appindicator3-1 | libappindicator3-1, libxdo3"
assets = [
  ["target/release/vtype", "usr/bin/", "755"],
  ["packaging/deb/vtype.desktop", "etc/xdg/autostart/", "644"],
]

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSAttributedString", "NSBezierPath", "NSColor", "NSControl", "NSCursor", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSStringDrawing", "NSText", "NSTextField", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace", "NSParagraphStyle", "NSGraphicsContext", "libc"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXRoleConstants", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "CGGeometry"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSGeometry", "NSLocale", "NSString", "NSValue"] }

[target."cfg(windows)".dependencies]
# windows-core: the COM `implement` macro (a focus handler for UI Automation) expands to paths in it.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["ApplicationModel", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# One async runtime on Linux: zbus's own async-io (ashpd would bring tokio by default).
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies", "wrappers"] }
gtk = "0.18"
x11rb = { version = "0.14.0", features = ["xtest"] }
zbus = "5.19.0"
