[package]
name = "vtype"
version = "0.1.0"
edition = "2021"
description = "vtype desktop: voice input into any app, using the vtype Chrome extension's speech recognition"
license = "MIT"
repository = "https://github.com/ishizakahiroshi/vtype"
authors = ["ishizakahiroshi <ishizakahiroshi.dev@gmail.com>"]
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
interprocess = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
