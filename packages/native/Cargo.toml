[package]
name = "vtype"
version = "0.1.0"
edition = "2021"
description = "vtype desktop: voice input into any app, using the vtype Chrome extension's speech recognition"
license = "MIT"
repository = "https://github.com/ishizakahiroshi/vtype"
authors = ["ishizakahiroshi <ishizakahiroshi.dev@gmail.com>"]
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
interprocess = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tiny-skia = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
arboard = "3.6.1"
global-hotkey = "0.8.0"
notify-rust = "4.18.0"
open = "5.4.4"
tray-icon = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
